<!DOCTYPE html>
<html>
<head>
    <title>Game Backend Data</title>

    <style>
        body{
            font-family: Arial;
            background:#111;
            color:white;
            padding:20px;
        }

        pre{
            background:black;
            padding:15px;
            border-radius:8px;
            overflow:auto;
        }

        button{
            padding:8px 15px;
            margin-bottom:15px;
            cursor:pointer;
        }
    </style>
</head>

    <body>

        <h1>Backend Game Data</h1>

        <button onclick="loadData()">Refresh</button>
        <button onclick="autoRefresh()">Auto Refresh</button>

        <p id="output"></p>

        <script>

            let interval = null;

            async function loadData(){

                const response = await fetch("/api/game");
                const data = await response.json();

                document.getElementById("output")
                    .textContent =
                    JSON.stringify(data, null, 2);
            }


            function autoRefresh(){

                if(interval){
                    clearInterval(interval);
                    interval = null;
                    alert("Auto refresh OFF");
                    return;
                }

                interval = setInterval(loadData, 1000);
                alert("Auto refresh ON");
            }

            loadData();

        </script>

    </body>
</html>
